name: check-branch
description: >-
  The branch name, its linked issue, and (once a pull request exists) that issue's Development
  link and parent must match WisewareOrg/.github's PROCESS.md.
inputs:
  github-token:
    description: Token for the GitHub REST and GraphQL calls.
    required: false
    default: ${{ github.token }}
  branch:
    description: The branch name to check.
    required: false
    default: ${{ github.event.pull_request.head.ref }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: false

    - name: check-branch
      shell: bash
      env:
        HEAD_REF: ${{ inputs.branch }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-branch check-branch
