[project]
name = "wise-ci"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false
default-groups = ["test"]
python-downloads = "never"
python-preference = "only-system"

[dependency-groups]
test = [
  "pytest",
  "coverage>=7.10",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# --cov=. (rather than bare --cov) fixes the coverage source at the repository root by default, so
# `uv run pytest`'s own fail_under check (from [tool.coverage.report] below) covers every check;
# one-check mode overrides it with --cov-reset --cov=<check> (justfile, docs/TESTING.md § Running
# tests locally).
addopts = ["--strict-markers", "--strict-config", "-q", "--cov=.", "--cov-report=term-missing"]
# Glob, not a literal list: matches every existing and future "<check>/tests/" at the repository
# root without naming a check (docs/TESTING.md § Where tests live).
testpaths = ["*/tests"]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
source = ["."]
omit = ["*/tests/*", ".venv/**"]

[tool.coverage.report]
fail_under = 100
include_namespace_packages = true
# [run] omit is not inherited here: with include_namespace_packages, the report's own file
# discovery walks `source` independently and .venv leaks in as a pile of 0%-covered "packages"
# unless it is excluded again at this level.
omit = ["*/tests/*", ".venv/**"]
