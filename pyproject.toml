[project]
name = "wise-ci"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false
default-groups = ["test"]
python-downloads = "never"
python-preference = "only-system"

[dependency-groups]
test = [
  "pytest",
  "coverage>=7.10",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# Bare --cov (no path) leaves the coverage source to [tool.coverage.run] source below, so it is
# defined in one place; one-check mode overrides it with --cov-reset --cov=<check> (justfile,
# docs/TESTING.md § Running tests locally). :skip-covered collapses a fully-covered file to the
# summary line instead of listing it, so a green run stays short; a file under 100% still lists
# its missing lines.
addopts = ["--strict-markers", "--strict-config", "-q", "--cov", "--cov-report=term-missing:skip-covered"]
# Glob, not a literal list: matches every existing and future "<check>/tests/" at the repository
# root without naming a check (docs/TESTING.md § Where tests live).
testpaths = ["*/tests"]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
source = ["."]
omit = ["*/tests/*", ".venv/**"]
# The main pytest process never runs a check's own code — the subprocess route the tests use
# does (docs/TESTING.md § Real dependencies where possible) — so it always collects nothing
# itself; that's expected, not a sign of a broken run, and include_namespace_packages below
# still fails fail_under if a subprocess genuinely collected nothing.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
fail_under = 100
include_namespace_packages = true
# [run] omit is not inherited here: with include_namespace_packages, the report's own file
# discovery walks `source` independently and .venv leaks in as a pile of 0%-covered "packages"
# unless it is excluded again at this level.
omit = ["*/tests/*", ".venv/**"]
