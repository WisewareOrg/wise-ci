[project]
name = "wise-ci"
version = "0"
requires-python = ">=3.12"
# repo-floor/repo-floor.py's runtime dependency, installed by its action.yml from the frozen
# lock (SECURITY.md); Renovate-managed like every other pin in this repository.
dependencies = [
  "PyYAML==6.0.3",
]

[tool.uv]
package = false
default-groups = ["test"]
python-downloads = "never"
python-preference = "only-system"

[tool.uv.workspace]
members = ["check-*"]

[dependency-groups]
test = [
  "pytest",
  "coverage>=7.10",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# :skip-covered collapses a fully-covered file to the summary line instead of listing it, so a
# green run stays short; a file under 100% still lists its missing lines.
addopts = ["--strict-markers", "--strict-config", "-q"]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
# .claude/** is gitignored machinery, not project content (docs/README.md) — an agent worktree
# under .claude/worktrees/ can otherwise duplicate a check's own source as unexecuted.
omit = ["*/tests/*", ".venv/**", ".claude/**"]
# A check's tests reach its script either as a subprocess (check-eol; docs/TESTING.md § Real
# dependencies where possible), which the main pytest process itself collects nothing for, or by
# importing it in-process (check-branch), which the main process collects directly. Collecting
# nothing is expected on the subprocess route, not a sign of a broken run, and
# include_namespace_packages below still fails fail_under if a subprocess genuinely collected
# nothing.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
fail_under = 100
include_namespace_packages = true
# [run] omit is not inherited here: with include_namespace_packages, the report's own file
# discovery walks `source` independently and .venv (and an agent worktree under .claude/) leaks
# in as a pile of 0%-covered "packages" unless excluded again at this level too.
omit = ["*/tests/*", ".venv/**", ".claude/**"]
