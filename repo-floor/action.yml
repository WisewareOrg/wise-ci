name: repo-floor
description: >-
  A repository's live rulesets must meet the floor stated once in WisewareOrg/.github's
  repository-floor.yml (PROCESS.md PROC-011).
inputs:
  github-token:
    description: Token for the GitHub REST calls.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: false

    - name: repo-floor
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        uv run --project "$GITHUB_ACTION_PATH/.." --frozen --no-default-groups
        python "$GITHUB_ACTION_PATH/repo-floor.py"
