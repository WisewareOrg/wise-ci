name: check-docs-index
description: Every tracked Markdown file outside a top-level dot-directory has a row in docs/README.md's index, and every row is unique, resolves, and fills both its cells.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: false

    - name: check-docs-index
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-docs-index check-docs-index
