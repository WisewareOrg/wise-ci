name: check-python-floor

# docs/TESTING.md § In CI: runs only when the wiring workflow (ci.yml) calls it.
on:
  workflow_call:

permissions: {}

concurrency:
  group: check-python-floor-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, for consistency across every workflow in this repository.
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A verdict moves only when a workflow or a pinned tool does (docs/CI.md § Workflow
      # supply-chain and privilege audit); Renovate bumps this version natively.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      # docs/TESTING.md § In CI.
      - name: pytest (just test check-python-floor)
        run: just test check-python-floor

      # docs/TESTING.md § In CI.
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-check-python-floor
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # check-python-floor run over a conformant fixture repository generated at job time, not over
  # wise-ci's own tree (docs/TESTING.md § In CI). wise-ci is checked out below the workspace root
  # so the fixture can be the workspace root, which is where an action runs. The last step
  # asserts the run took the floor path, not the no-Python pass.
  self-check:
    name: self-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: wise-ci

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Build the conformant fixture
        run: |
          git init -q
          echo wise-ci/ >> .git/info/exclude
          uv run --locked --project wise-ci --package check-python-floor python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'wise-ci/check-python-floor/tests')
          import floor_repo
          floor_repo.make_repo(Path('.'), floor_repo.pyproject())
          "

      - uses: ./wise-ci/check-python-floor

      - name: The run took the floor path, not the no-Python pass
        run: |
          set -euo pipefail
          out="$(uv run --locked --project wise-ci --package check-python-floor check-python-floor)"
          echo "$out"
          if grep -qi 'no python' <<< "$out"; then
            echo "the floor passed as no-Python over a repository that tracks Python" >&2
            exit 1
          fi
