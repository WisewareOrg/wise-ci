name: ci

# Every pull request, with no `paths:` filter — a required check that never starts blocks the
# merge indefinitely — every push to `main`, and weekly (so a dormant branch is still covered).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

# A superseded pull-request head cancels its own run. A push or schedule run gets a group of its
# own, keyed on the sha: in a shared group a newly queued run would replace the pending one even
# with cancel-in-progress false, and a replaced push run is a push whose commits secret-scan never
# walks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, except the reusable-workflow calls below, whose own jobs
  # report to branch protection as `<this job> / <their job>` — none of those composite names is
  # itself required. `check-branch`, `pr-title` and `repo-floor` are each their own required
  # status-check context too, but from `process-gates.yml`'s top-level jobs, not from these
  # reusable-workflow calls (docs/CI.md § First-party source scanning).
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: codeql
    permissions:
      contents: read # codeql.yml's own top-level permissions declares it; a caller's grant is its ceiling
      security-events: write # analyze uploads the SARIF results to code scanning
      actions: read # init reads workflow run metadata
    uses: ./.github/workflows/codeql.yml

  check-eol:
    name: check-eol
    permissions:
      contents: read
    uses: ./.github/workflows/check-eol.yml

  check-docs-index:
    name: check-docs-index
    permissions:
      contents: read
    uses: ./.github/workflows/check-docs-index.yml

  check-adrs:
    name: check-adrs
    permissions:
      contents: read
    uses: ./.github/workflows/check-adrs.yml

  check-branch:
    name: check-branch
    permissions:
      contents: read
    uses: ./.github/workflows/check-branch.yml

  check-reqs:
    name: check-reqs
    permissions:
      contents: read
    uses: ./.github/workflows/check-reqs.yml

  repo-floor:
    name: repo-floor
    permissions:
      contents: read
    uses: ./.github/workflows/repo-floor.yml

  pr-title:
    name: pr-title
    permissions:
      contents: read
    uses: ./.github/workflows/pr-title.yml

  ci:
    name: ci
    needs: [checks, codeql, check-eol, check-docs-index, check-adrs, check-branch, check-reqs, repo-floor, pr-title]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lists every job in this run, so one left out of needs: cannot hide
    steps:
      # A job skipped because a dependency failed reads green by default; this asserts success
      # explicitly instead (docs/TESTING.md § In CI).
      - name: Require every called workflow to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

      # needs: above is hand-kept; this checks the run's own job list instead of trusting that
      # list to stay in sync with it, so a job added to this workflow without being added to
      # needs: cannot run unwatched (docs/TESTING.md § In CI). An empty job list — a failed API
      # call, a wrong run id — fails loudly rather than reading as "nothing failed".
      - name: Require every job in this run to have succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[]' \
            > "$RUNNER_TEMP/run-jobs.json"

          count="$(jq -s 'length' "$RUNNER_TEMP/run-jobs.json")"
          if [ "$count" -eq 0 ]; then
            echo "the run's job list came back empty" >&2
            exit 1
          fi

          unfinished="$(jq -s -r '[.[] | select(.name != "ci") | select(.status != "completed" or .conclusion != "success") | .name] | .[]' "$RUNNER_TEMP/run-jobs.json")"
          if [ -n "$unfinished" ]; then
            echo "$unfinished"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A verdict moves only when a workflow or a pinned tool does (docs/CI.md § Workflow
      # supply-chain and privilege audit); Renovate bumps this version natively.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Download every check's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      # Combines the downloaded .coverage.* data (docs/TESTING.md § In CI). justfile's
      # merge-coverage recipe.
      - name: Merge coverage
        run: just merge-coverage

      # Re-derives the expected file list independently of the coverage configuration that
      # normally discovers it (docs/TESTING.md § In CI). Inline rather than a tracked script, so
      # actionlint's own embedded shellcheck reaches it (docs/CI.md § Workflow supply-chain and
      # privilege audit); its one coverage command is still the justfile's coverage-json recipe, so
      # no pytest or coverage command in CI bypasses just.
      - name: Every tracked Python file outside tests is in the merged coverage data
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git ls-files '*.py' ':!:**/tests/**' | sort > "$tmp/expected-py-files"

          if [ ! -s "$tmp/expected-py-files" ]; then
            echo "no tracked Python files were found outside tests — run this from the repository root" >&2
            exit 1
          fi

          just coverage-json "$tmp/coverage.json"
          jq -r '.files | keys[]' "$tmp/coverage.json" | sort > "$tmp/covered-py-files"

          missing="$(comm -23 "$tmp/expected-py-files" "$tmp/covered-py-files")"
          if [ -n "$missing" ]; then
            echo "missing from the merged coverage data:"
            echo "$missing"
            exit 1
          fi

      # justfile's coverage-report recipe.
      - name: Coverage report, fail under 100%
        run: just coverage-report
