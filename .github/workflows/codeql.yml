name: CodeQL

# docs/CI.md § First-party source scanning.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, this one included — but a matrix leg's platform-displayed
  # check name carries the matrix's `language` and `build-mode` values as a suffix, on top of that
  # name (docs/CI.md § First-party source scanning).
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write # analyze uploads the SARIF results to code scanning
      actions: read # init reads workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `queries:` input (docs/CI.md § First-party source scanning).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
