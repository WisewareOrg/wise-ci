name: pr-title

# docs/TESTING.md § In CI: runs only when the wiring workflow (ci.yml) calls it.
on:
  workflow_call:

permissions: {}

concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, for consistency across every workflow in this repository.
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Install pr-title/, locked
        run: npm --prefix pr-title ci --ignore-scripts

      # A verdict moves only when a workflow or a pinned tool does (docs/CI.md § Workflow
      # supply-chain and privilege audit); Renovate bumps this version natively.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      # docs/TESTING.md § In CI.
      - name: pytest, one-check mode (just test pr-title)
        run: just test pr-title

      # docs/TESTING.md § In CI.
      - name: pytest, under coverage
        run: just test-ci pr-title

      # docs/TESTING.md § In CI.
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-pr-title
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # docs/TESTING.md § The action.
  expected-failure:
    name: expected-failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "pr-title ('fixup! feat: x' violates PROC-009 under defaultIgnores:false; expected to fail)"
        id: pr-title
        continue-on-error: true
        uses: ./pr-title
        with:
          title: "fixup! feat: x"

      - name: The previous step must have failed
        if: steps.pr-title.outcome != 'failure'
        run: exit 1
