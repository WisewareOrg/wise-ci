name: check-branch

# docs/TESTING.md § In CI: runs only when the wiring workflow (ci.yml) calls it.
on:
  workflow_call:

permissions: {}

concurrency:
  group: check-branch-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, for consistency across every workflow in this repository.
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A verdict moves only when a workflow or a pinned tool does (docs/CI.md § Workflow
      # supply-chain and privilege audit); Renovate bumps this version natively.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      # docs/TESTING.md § In CI.
      - name: pytest, one-check mode (just test check-branch)
        run: just test check-branch

      # docs/TESTING.md § In CI.
      - name: pytest, under coverage
        run: just test-ci check-branch

      # docs/TESTING.md § In CI.
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-check-branch
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # check-branch run over its own ticket's pull request: the check's integration test
  # (docs/TESTING.md § In CI; docs/CI.md § check-branch).
  self-check:
    name: self-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./check-branch
        if: github.event_name == 'pull_request'

  # docs/TESTING.md § The action.
  expected-failure:
    name: expected-failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check-branch ('nodashes' violates PROC-001; expected to fail)
        id: check-branch
        continue-on-error: true
        uses: ./check-branch
        with:
          branch: nodashes

      - name: The previous step must have failed
        if: steps.check-branch.outcome != 'failure'
        run: exit 1
