name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. CI holds no custom
# credential (SECURITY.md § Threat model).
on:
  push:
    branches: [main]
  pull_request:
    # edited: the pr-title gate validates the PR title, so title fixes must re-run it
    types: [opened, edited, synchronize, reopened]

permissions: {}

# A superseded pull-request head cancels its own run. A push run gets a group of its own, keyed on
# the sha: in a shared group a newly queued run replaces the pending one even with cancel-in-progress
# false, and a replaced push run is a push whose commits the secret scan never walks.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow supply-chain and privilege audit (zizmor, pedantic persona, offline audit set)
        uses: docker://ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 # 1.29.0
        with:
          args: --strict-collection --persona=pedantic .github/workflows

      - name: Workflow schema and expression lint (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scan walks a commit range, which a shallow clone does not carry
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: pr-title
    # The PR title is what becomes the commit on `main` under squash-merge.
    # It is attacker-controlled, so it enters the run step only via env mapping, never inline.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install tooling/commitlint/, locked
        run: npm --prefix tooling/commitlint ci

      # NODE_PATH resolves the configs' `extends` from the pinned install (docs/CI.md § PR title).
      - name: PR title is a Conventional Commit (the squash-merge commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          NODE_PATH: ${{ github.workspace }}/tooling/commitlint/node_modules
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          COMMITLINT_TITLE_FILE="$RUNNER_TEMP/pr-title" tooling/commitlint/node_modules/.bin/commitlint --config .commitlintrc-pr-title.json --env COMMITLINT_TITLE_FILE

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: just test
        run: uv run just test

  action-tests-check-eol:
    name: action-tests-check-eol
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out wise-ci to a scratch path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scratch
          persist-credentials: false

      # Same export semantics as the tarball a runner downloads for a remote `uses:` (strategy §4,
      # action-tests-<check> step 1); the scratch checkout is then deleted.
      - name: Extract git archive HEAD into .wise-ci/
        run: |
          mkdir -p .wise-ci
          git -C scratch archive HEAD | tar -x -C .wise-ci
          rm -rf scratch

      # The workspace becomes the fixture tree check-eol judges, kept separate from the action's
      # own files under .wise-ci/ (strategy F1: a script that finds its tree from its own path must
      # not be able to land on itself).
      - name: Initialize the workspace as the fixture repo, excluding .wise-ci/
        run: |
          git init -q -b main
          echo '.wise-ci/' >> .git/info/exclude

      - name: Build a clean fixture (a tracked all-LF file)
        run: |
          printf 'hello\n' > clean.txt
          git add clean.txt
          git -c user.email=fixture@wise-ci.invalid -c user.name=wise-ci-fixture commit -q -m fixture

      - name: "check-eol: clean fixture (must pass)"
        uses: ./.wise-ci/check-eol

      # Independent confirmation (strategy D5): the seeded file's bytes, not the check under test.
      - name: "check-eol: seed a tracked CRLF file (must fail)"
        run: |
          printf 'line one\r\nline two\r\n' > defect.txt
          git add defect.txt
          git -c user.email=fixture@wise-ci.invalid -c user.name=wise-ci-fixture commit -q -m defect
          python3 -c "import sys; sys.exit(0 if b'\r' in open('defect.txt', 'rb').read() else 1)"

      - name: "check-eol: seed (must fail)"
        id: seed
        continue-on-error: true
        uses: ./.wise-ci/check-eol

      - name: Confirm the seed made check-eol fail
        if: steps.seed.outcome != 'failure'
        run: exit 1

  action-tests:
    name: action-tests
    needs: [action-tests-check-eol]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Closes F2: a skipped required check reads green, so this asserts success explicitly rather
      # than relying on the job's own default (which would report success on skip).
      - name: Require every action-tests-* job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  check-eol:
    name: check-eol
    # Self-gating (ADR 0001 rev 1 point 5): product use, not verification. Not a required check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./check-eol
