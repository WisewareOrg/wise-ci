name: check-adrs
description: The docs/decisions/ directory and its index table agree, and every citation of an ADR pins that ADR's current rev.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: false

    - name: check-adrs
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-adrs check-adrs
