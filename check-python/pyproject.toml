[project]
name = "check-python"
version = "0"
requires-python = ">=3.12"
dependencies = [
  "ruff==0.17.6",
  "ty==0.0.109",
  "interrogate==1.7.0",
  "pydoclint==0.12.0",
]

[project.scripts]
check-python = "check_python:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
