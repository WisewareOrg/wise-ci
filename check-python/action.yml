name: check-python
description: >-
  The repository at the working directory passes the org Python standard. The repository must
  already be synced (`uv sync`).
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"
        enable-cache: false

    - name: check-python
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-python check-python
