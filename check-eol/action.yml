name: check-eol
description: Every file git treats as text is LF-only, over the whole tracked tree.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: false

    - name: check-eol
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-eol check-eol
