name: check-eol
description: Every file git treats as text is LF-only, over the whole tracked tree.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"
        enable-cache: false

    - name: check-eol
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-eol check-eol
