name: check-eol
description: Every file git treats as text is LF-only, over the whole tracked tree.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.6"
        enable-cache: false

    - name: check-eol
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-eol check-eol
