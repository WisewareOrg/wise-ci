name: check-python-floor
description: >-
  The repository's root pyproject.toml meets the org Python floor; passes when the
  repository tracks no Python.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.10"
        enable-cache: false

    - name: check-python-floor
      shell: bash
      run: uv run --locked --project "$GITHUB_ACTION_PATH/.." --package check-python-floor check-python-floor
